{% extends "base.html" %}

{% block title %}
Edit Doctor
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/add_doctor.css') }}">
{% endblock %}

{% block content %}

<div class="card form-card">

    <a href="{{ url_for('main.doctor_setup') }}" class="back-btn">
        ← Back
    </a>

    <h2>Edit Doctor</h2>

    <form method="POST">

        <!-- Doctor Code -->
        <label for="doc_code">Doctor Code</label>
        <input
            type="text"
            id="doc_code"
            name="doc_code"
            value="{{ doctor.doc_code }}"
            required
        >

        <!-- Doctor Name -->
        <label for="doc_name">Doctor Name</label>
        <input
            type="text"
            id="doc_name"
            name="doc_name"
            value="{{ doctor.doc_name }}"
            required
        >

        <!-- Department -->
        <label for="department_id">Department</label>

        <select
            id="department_id"
            name="department_id"
            required
        >

            <option value="">Select Department</option>

            {% for department in departments %}

                <option
                    value="{{ department.id }}"
                    {% if department.id == doctor.department_id %}
                        selected
                    {% endif %}
                >
                    {{ department.department_name }}
                </option>

            {% endfor %}

        </select>

        <!-- Specialization -->
        <label for="specialization">
            Specialization
        </label>

        <input
            type="text"
            id="specialization"
            name="specialization"
            value="{{ doctor.specialization }}"
            required
        >

        <!-- Email -->
        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            value="{{ doctor.email or '' }}"
        >

        <!-- Phone -->
        <label for="phone">
            Phone
        </label>

        <input
            type="text"
            id="phone"
            name="phone"
            value="{{ doctor.phone or '' }}"
        >

        <!-- Status -->
        <label for="status">
            Status
        </label>

        <select
            id="status"
            name="status"
            required
        >

            <option
                value="Active"
                {% if doctor.status == "Active" %}
                    selected
                {% endif %}
            >
                Active
            </option>

            <option
                value="Inactive"
                {% if doctor.status == "Inactive" %}
                    selected
                {% endif %}
            >
                Inactive
            </option>

        </select>

        <button type="submit">
            Update Doctor
        </button>

    </form>

</div>

{% endblock %}
